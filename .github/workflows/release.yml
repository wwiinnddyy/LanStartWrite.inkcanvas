# 揽星书写 · Release 工作流
#
# 产物（Windows 用 NSIS 安装包，Linux 用 AppImage）：
#   LanStartWrite.Inkcanvas-<版本>-windows-x64-setup.exe
#   LanStartWrite.Inkcanvas-<版本>-linux-x64.AppImage
#
# 怎么触发：
#   1. Actions 页手动触发（workflow_dispatch），填版本号（如 1.2.0，不带 v 前缀）；
#      默认不建 Release（勾上才建），所以可以先拿它当"能不能编出来"的探针反复跑；
#   2. 或推送 v 开头的 tag（v1.2.0 → 版本号取 1.2.0），那条路一定会建 Release。
#
# 两个必须知道的依赖（都签出在仓库之外，见 fluentjalium 那一步）：
#   - FluentJalium（兄弟仓库，源码直引）—— 默认签出 **Astra** 分支，不是 main：
#     main 那份布局里根本没有 src/FluentJalium/FluentJalium.csproj（Astra 是整体替换）。
#     钉到某个提交用仓库变量 FLUENT_JALIUM_REF。库已是双目标（net10.0-windows + net10.0），
#     所以不再有"补一刀"的兜底步骤 —— 哪天它退回单目标，还原会红在 NU1201（两端都会，
#     因为还原走的是应用那张双目标图）。
#   - Dusk（闭源 SDK，feed 在 ../dusk-feed）—— packaging/feed 里随仓库带了一份拷贝，
#     CI 上没有那个本机路径，所以 restore 前先把本机源摘掉，只认随仓库的这份。
#
# 三处单位/命名坑，都是踩过一次才知道的：
#   - RID 是 win-x64 / linux-x64，不是 windows-x64 / linux-x64（矩阵里 platform 只当名字用）。
#   - choco 装的 makensis 在**同一步**里不会出现在 PATH 上（PATH 是进程启动时那份），
#     所以要按安装位置点名。
#   - installer.nsi 的 OutFile 是 ..\dist\ —— 相对它自己算，所以工作目录必须是 packaging/windows。

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（三段式，如 1.2.0，不带 v 前缀）'
        required: true
        type: string
      self_contained:
        description: '自带 .NET 运行时（体积大但开箱即跑）'
        type: boolean
        default: true
      create_release:
        description: '打完包后创建 GitHub Release 并上传产物'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CONFIGURATION: Release
  DOTNET_VERSION: '10.0.x'
  APPBASENAME: LanStartWrite.Inkcanvas

jobs:
  # 版本号只在这儿算一次：build / flatpak / linglong / release 四个 job 的产物名与 tag 都取自它。
  # 之前每个 job 自己解析一遍，tag 触发时 github.ref_name 还带着 v，产物名与 tag 会分叉。
  resolve:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      self_contained: ${{ steps.v.outputs.self_contained }}
    steps:
      - name: 校验并解析
        id: v
        shell: bash
        env:
          # 手动触发填的版本号经 env 进脚本，不直接插进 run 那一串：
          # workflow 的 run 块是先展开再交给 shell 的，把外部输入拼进脚本文本里就是脚本注入的面。
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SELF_CONTAINED: ${{ inputs.self_contained }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号必须是三段式（如 1.2.0），收到：$raw"
            exit 1
          fi
          # 自带运行时是默认（AppImage 的"开箱即跑"与安装器的零依赖都靠它）；
          # 只有手动触发、且显式取消勾选时才退回 framework-dependent（装包小，但要求机器装了 .NET 10）。
          self_contained="true"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SELF_CONTAINED" = "false" ]; then
            self_contained="false"
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "self_contained=$self_contained" >> "$GITHUB_OUTPUT"

  build:
    name: 打包（${{ matrix.platform }}）
    runs-on: ${{ matrix.os }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            rid: win-x64
            target_framework: net10.0-windows
            # 安装包在 packaging/dist 下（NSIS 脚本从自己的目录算相对路径，见该文件）。
            artifact_glob: packaging/dist/*.exe
          - os: ubuntu-latest
            platform: linux-x64
            rid: linux-x64
            target_framework: net10.0
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: 签出本仓库
        uses: actions/checkout@v4

      # FluentJalium 是兄弟仓库、源码直引（见 csproj 的 FluentJaliumProject 属性）。
      # 默认 Astra；要钉某个提交就用仓库变量 FLUENT_JALIUM_REF。
      - name: 签出 FluentJalium
        uses: actions/checkout@v4
        with:
          repository: wwiinnddyy/FluentJalium
          ref: ${{ vars.FLUENT_JALIUM_REF || 'Astra' }}
          path: fluentjalium

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4

      # NuGet.config 里排在前面的 dusk-sdk 是本机路径（../dusk-feed），CI 上没有。
      # 摘掉它，还原只可能从随仓库那份 packaging/feed 里拿到 Dusk —— 拿不到就当场红，
      # 而不是留一句"源不存在"的警告让人去猜是哪个 feed 供的包。
      - name: 只认随仓库那份 Dusk feed
        shell: bash
        run: |
          dotnet nuget remove source dusk-sdk --configfile NuGet.config
          dotnet nuget list source --configfile NuGet.config

      - name: 发布（${{ matrix.platform }}）
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SELF_CONTAINED: ${{ needs.resolve.outputs.self_contained }}
          FLUENT_JALIUM: ${{ github.workspace }}/fluentjalium/src/FluentJalium/FluentJalium.csproj
        run: |
          dotnet publish src/LanStartWrite.Inkcanvas/LanStartWrite.Inkcanvas.csproj \
            -c "$CONFIGURATION" \
            -f "${{ matrix.target_framework }}" \
            -r "${{ matrix.rid }}" \
            --self-contained "$SELF_CONTAINED" \
            -p:Version="$VERSION" \
            -p:FluentJaliumProject="$FLUENT_JALIUM" \
            -o publish

      - name: Windows · NSIS 安装包
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # choco 装的 makensis 在本进程的 PATH 上还没有（PATH 是进程启动时那份），
          # 所以先找、找不到就装、装完按安装位置点名。
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Null
            $candidates = @(
              "$env:ProgramFiles\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { Write-Error "makensis 没找到（choco 装完了也不在预期位置）"; exit 1 }
          Write-Host "makensis: $makensis"

          # 版本资源要四段数字，预发布后缀进不去 —— 从 VERSION 抠出三段数字补 .0。
          $version4 = if ($env:VERSION -match '^(\d+\.\d+\.\d+)') { $Matches[1] + '.0' } else { '0.0.0.0' }
          # 在脚本自己的目录里跑：installer.nsi 的 OutFile 是 ..\dist\，相对它才算得对。
          Set-Location packaging/windows
          New-Item -ItemType Directory -Force ../dist | Out-Null
          & $makensis "/DVERSION=$env:VERSION" `
                       "/DVERSION4=$version4" `
                       "/DBINDIR=$env:GITHUB_WORKSPACE\publish" `
                       installer.nsi 2>&1 | Tee-Object -FilePath makensis.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 有一类警告不是噪音，是"装/卸的动作其实没接上"：
          # "Uninstall page instfiles not used, no sections will be executed!" 意味着卸载器一节都不跑
          # （退出码照样是 0，安装包照样产出，只有真去卸载才发现什么都没删）—— 当场红掉。
          $fatal = Select-String -Path makensis.log -Pattern "no sections will be executed" -SimpleMatch
          if ($fatal) { Write-Error "NSIS 警告：$($fatal[0].Line)"; exit 1 }
          Get-ChildItem ../dist | Format-Table Name, Length

      - name: Linux · AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # appimagetool 的两个硬依赖：desktop-file-validate（缺了直接退出码 1，实测红过）、
          # 以及 mksquashfs（产 AppImage 本体）。runner 镜像里前者没有，所以按需 apt 补一次。
          missing=""
          command -v desktop-file-validate >/dev/null || missing="$missing desktop-file-utils"
          command -v mksquashfs >/dev/null || missing="$missing squashfs-tools"
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends $missing
          fi
          echo "补齐：${missing:-都不缺}"
          # 打包工具（appimagetool）由脚本自己取：它得先解包再跑，CI 上没有 FUSE。
          chmod +x packaging/linux/build-appimage.sh packaging/linux/build-deb.sh
          packaging/linux/build-appimage.sh publish "$VERSION" dist
          ls -la dist

      - name: Linux · deb
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          packaging/linux/build-deb.sh publish "$VERSION" amd64 dist
          dpkg-deb -I dist/*.deb | sed -n '1,20p'

          # 造出来 ≠ 装得上。控制环境里真 apt 一次：装、落位、.desktop 合法、以及
          # "动态库有没有没解析出来的" —— 后者是 Depends 有没有少写的实测答案，
          # 不是照抄别人的 deb 猜的。
          appid=$(cat packaging/linux/appid)
          docker run --rm -e APPID="$appid" -v "$GITHUB_WORKSPACE:/w" -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq >/dev/null
            apt-get install -y -qq desktop-file-utils ./dist/*.deb >/dev/null && echo "apt install：OK"
            echo "落位："; dpkg -L lanstartwrite | sed "s|^|  |"
            test -x /usr/bin/lanstartwrite || { echo "没有 /usr/bin/lanstartwrite"; exit 1; }
            desktop-file-validate "/usr/share/applications/$APPID.desktop" && echo "desktop-file-validate：OK"
            echo "== 没解析出来的动态库（空才对；非空说明 Depends 少写）=="
            ldd /opt/lanstartwrite/LanStartWrite.Inkcanvas /opt/lanstartwrite/*.so 2>/dev/null \
              | grep "not found" | sort -u | sed "s|^|  MISSING |" || echo "  （无）"
          '
          # APPID 在五个地方出现（appid 文件、.desktop 文件名与 Icon=、flatpak 清单、玲珑 yaml）——
          # 抄不一致的症状是"装了三个各带一张默认图的同名应用"，所以扫一遍：
          # 这一目录下任何 *.lanstartwrite 形状的名字都必须等于 appid 文件里那一个。
          appid=$(cat packaging/linux/appid)
          stale=$(grep -rhoE "[A-Za-z0-9_.-]+\.lanstartwrite" packaging/linux | sort -u | grep -vxF "$appid" || true)
          if [ -n "$stale" ]; then
            echo "::error packaging/linux 里有与 appid 不一致的标识：$stale（appid=$appid）"
            exit 1
          fi
          test -f "packaging/linux/$appid.desktop" && test -f "packaging/linux/$appid.png"
          grep -q "^Icon=$appid$" "packaging/linux/$appid.desktop"
          echo "APPID 一致：$appid"

      # deb 与 AppImage 里那份 .deb 之外，把裸发布目录也留一份：
      # flatpak 与玲珑这两个 job 只装包，不再重跑一遍 dotnet publish（同一份产物、同一次编译）。
      - name: 上传 Linux 发布目录（给 flatpak / 玲珑用）
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-publish-${{ needs.resolve.outputs.version }}
          path: publish
          if-no-files-found: error

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPBASENAME }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # Flatpak：清单在 packaging/linux/<appid>.json，载荷直接取 build 那个 job 的发布目录
  # （同一份编译产物，不在这里再 publish 一遍 —— 两个 job 各编一次迟早会分出两个版本）。
  flatpak:
    name: Flatpak
    needs: [build, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: 签出本仓库
        uses: actions/checkout@v4

      - name: 取 Linux 发布目录
        uses: actions/download-artifact@v4
        with:
          name: linux-publish-${{ needs.resolve.outputs.version }}
          path: publish

      - name: 装工具链与运行时
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder bubblewrap
          flatpak --version; flatpak-builder --version
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          time flatpak install -y --user flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: 构建并打离线包
        shell: bash
        env:
          APPID_FILE: packaging/linux/appid
        run: |
          set +e
          appid=$(cat "$APPID_FILE")
          manifest="packaging/linux/$appid.json"
          # 清单里的 source 路径是相对清单文件算的，所以发布目录得搬到它旁边。
          cp -a publish "$(dirname "$manifest")/files"
          time flatpak-builder --user --assumeyes --force-clean \
            --repo=/tmp/repo --state-dir=/tmp/fbstate /tmp/bc "$manifest"
          echo "builder rc=$?"
          echo "== 装进用户实例，验一下里面到底有什么 =="
          flatpak-builder --user --install=/tmp/inst /tmp/bc "$manifest"
          echo "install rc=$?"
          flatpak info "$appid" 2>&1 | head -12
          ls -la "/tmp/inst/files/$appid" 2>&1 | head -5
          echo "== 打单文件 .flatpak =="
          flatpak build-bundle /tmp/repo "$appid.flatpak" "$appid" 2>&1 | tail -3
          mkdir -p dist && mv "$appid.flatpak" "dist/LanStartWrite.Inkcanvas-${{ needs.resolve.outputs.version }}-linux-x64.flatpak" 2>/dev/null
          ls -la dist
          if [ ! -s "dist/LanStartWrite.Inkcanvas-${{ needs.resolve.outputs.version }}-linux-x64.flatpak" ]; then
            echo "::error 没有产出 .flatpak"
            echo "环境硬约束：userns=$(cat /proc/sys/user/max_user_namespaces 2>&1) unprivileged_userns=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>&1)"
            echo "bwrap 自检：$(bwrap --ro-bind / / --dev /dev --unshare-all echo ok 2>&1 | tail -1)"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanStartWrite.Inkcanvas-${{ needs.resolve.outputs.version }}-linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # 玲珑 / Linyaps：不重编应用，把同一个 .deb 摊进容器（官方 deb_conversion 那条路）。
  # 未知量两个：base 镜像 org.deepin.base 在海外 runner 上取不取得到；ll-builder 的容器构建
  # 在 runner 那种受限环境里跑不跑得起来。所以下面留了 diagnostics，红也要红得能读。
  linglong:
    name: 玲珑（Linyaps）
    needs: [build, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: 签出本仓库
        uses: actions/checkout@v4

      - name: 取 Linux 发布目录
        uses: actions/download-artifact@v4
        with:
          name: linux-publish-${{ needs.resolve.outputs.version }}
          path: publish

      - name: 装 linglong-bin 与 linglong-builder
        shell: bash
        run: |
          set -e
          # 官方一键脚本用的就是这个 OBS（docs/pages/en/guide/start/install.md 里那份
          # ci.deepin.com 的 xUbuntu_24.04 已经 404 了，实际目录名是 Ubuntu_24.04，且是 flat repo）。
          echo "deb [trusted=yes] https://ppa.linyaps.org.cn/release/Ubuntu_24.04/ ./" \
            | sudo tee /etc/apt/sources.list.d/linyaps.list
          sudo apt-get update -qq
          apt-cache policy linglong-bin linglong-builder | grep -aE "linglong|Candidate"
          sudo apt-get install -y -qq linglong-bin linglong-builder
          ll-builder --version; ll-cli --version

      - name: 造 deb、填模板、构建并导出
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set +e
          chmod +x packaging/linux/build-deb.sh
          appid=$(cat packaging/linux/appid)
          packaging/linux/build-deb.sh publish "$VERSION" amd64 dist
          deb=$(ls dist/*.deb)
          llversion=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1.0/')
          proj="/tmp/ll/$appid"; mkdir -p "$proj"
          cp "$deb" "$proj/"
          # url 先试 file:// 绝对路径；不行再试相对 ./ —— 文档只给了 https 的例子，本地写法没实测过。
          fill() {
            sed -e "s#@APPID@#$appid#g" -e "s#@LLVERSION@#$llversion#" \
                -e "s#@DEBNAME@#$(basename "$deb")#" -e "s#@DEBSHA256@#$(sha256sum "$deb" | cut -d' ' -f1)#" \
                -e "s#@DEBURL@#$1#" packaging/linux/linglong.yaml.in > "$proj/linglong.yaml"
          }
          fill "file://$(readlink -f "$deb")"
          echo "== 填好的 linglong.yaml =="; cat "$proj/linglong.yaml"
          cd "$proj"
          time timeout 1500 ll-builder build; rc=$?
          echo "build(file://) rc=$rc"
          if [ "$rc" != 0 ]; then
            echo "== 换相对路径重试 =="
            fill "./$(basename "$deb")"
            time timeout 1500 ll-builder build; rc=$?
            echo "build(relative) rc=$rc"
          fi
          echo "== export =="
          timeout 900 ll-builder export; echo "export rc=$?"
          timeout 900 ll-builder export --uab 2>&1 | tail -3; echo "uab rc=$?"
          find "$proj" -name "*.lca" -o -name "*.uab" | head
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$proj" -name "*.lca" -o -name "*.uab" -exec cp {} "$GITHUB_WORKSPACE/out/" \; -print
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/out" 2>/dev/null)" ]; then
            echo "::error 玲珑没产出 .lca / .uab —— 下面是环境硬约束"
            echo "userns max=$(cat /proc/sys/user/max_user_namespaces 2>&1) unprivileged=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>&1)"
            echo "fuse: $(ls -l /dev/fuse 2>&1 | tail -1)  crun: $(command -v crun || echo 缺)  uidmap: $(dpkg -l uidmap 2>/dev/null | tail -1)"
            echo "repo list: $(ll-cli repo list 2>&1 | head -5)"
            echo "base 能不能搜到: $(timeout 180 ll-cli search org.deepin.base 2>&1 | head -6)"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanStartWrite.Inkcanvas-${{ needs.resolve.outputs.version }}-linux-linglong
          path: out
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [build, flatpak, linglong, resolve]
    # 推 tag 一定发；手动触发要勾上那一格才发（不勾就只当探针跑一遍编译与打包）。
    if: ${{ github.event_name == 'push' || inputs.create_release }}

    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release（已存在就覆盖上传）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          mapfile -t files < <(find artifacts -type f)
          echo "本次上传："; printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" = 0 ]; then echo "::error::一个产物都没找到"; exit 1; fi

          # 同一个版本重跑（改了打包脚本再发一次）不该红在"Release 已存在"上。
          # 每条 gh 都要带 --repo：这个 job 没有 checkout 步骤，工作目录不是 git 仓库，
          # gh 靠 .git 猜仓库时直接 "failed to run git: fatal: not a git repository"（实测红过一次，
          # 而那一步之前 Release 与两个产物其实已经建好了）。
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "揽星书写 $VERSION" \
              --latest \
              --generate-notes \
              "${files[@]}"
          fi
          # 自检读回来的是真实状态：资产名一条条打出来。
          # （jq 里 `.assets[].name` 已经是字符串，别再跟一个 `[]` —— 那会去 iterate 一个字符串。）
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets -q '.tagName, .assets[].name'
