# 一次性探针（第二轮）：flatpak 与玲珑到底能不能在 GitHub runner 上真构建出来。
# 第一轮留下的：deb 已证明可行（造包 + ubuntu:24.04 容器里 apt install 成功、文件落位、脚本跑起来）；
# flatpak 那次红是我自己命令行写错（--disable-updates 不是它的选项，且少了必填的 DIRECTORY），不算结论。
# 玲珑这一轮用的是官方文档里两条实测过的路：
#   - 工具链：ci.deepin.com 的 obs 源有 xUbuntu_24.04 那份，包名 linglong-bin / linglong-builder
#   - 构建：linglong.yaml 里 kind: file 收一个现成的 .deb，build 段 dpkg-deb -R 摊进 $PREFIX
#     （官方 docs/pages/en/guide/building/deb_conversion.md 就是这个写法）
# 未知量只剩两个：base 镜像 org.deepin.base 在海外 runner 上取不取得到；ll-builder 的容器构建
# 在 runner 那种受限环境里跑不跑得起来。探完即删。
name: linux-formats-probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: flatpak（builder + 真跑一次）
    runs-on: ubuntu-latest
    steps:
      - name: 装工具链
        run: |
          set -e
          sudo apt-get update -qq
          time sudo apt-get install -y -qq flatpak flatpak-builder bubblewrap
          flatpak --version; flatpak-builder --version; bwrap --version
      - name: 建最小包并 flatpak run
        run: |
          set +e
          cat > /tmp/org.test.Probe.json <<'JSON'
          {
            "app-id": "org.test.Probe",
            "runtime": "org.freedesktop.Platform",
            "runtime-version": "23.08",
            "sdk": "org.freedesktop.Sdk",
            "command": "probe",
            "finish-args": ["--share=ipc", "--socket=fallback-x11", "--device=dri"],
            "modules": [{
              "name": "probe",
              "buildsystem": "simple",
              "build-commands": ["install -Dm755 probe.sh /app/bin/probe"],
              "sources": [{ "type": "script", "dest-filename": "probe.sh", "commands": ["echo flatpak-ran"] }]
            }]
          }
          JSON
          echo "== 拉 flathub 远端 =="
          time flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "remote rc=$?"
          echo "== builder（DIRECTORY 必填，写在 manifest 前面）=="
          time flatpak-builder --user --assumeyes --disable-sandbox --force-clean /tmp/bc /tmp/org.test.Probe.json
          echo "builder rc=$?"
          echo "== 装上再真跑一次 =="
          flatpak-builder --user --install=/tmp/inst /tmp/bc /tmp/org.test.Probe.json
          echo "install rc=$?"
          timeout 120 flatpak run org.test.Probe
          echo "run rc=$?"
          echo "== 打离线 bundle =="
          flatpak build-bundle /tmp/repo /tmp/probe.flatpak org.test.Probe 2>&1 | tail -3
          ls -la /tmp/probe.flatpak 2>&1; du -sh /tmp/inst 2>/dev/null

  linyaps:
    name: 玲珑（工具链 + base 镜像 + 容器构建）
    runs-on: ubuntu-latest
    steps:
      - name: 装 linglong-bin 与 linglong-builder
        run: |
          set +e
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/xUbuntu_24.04/ ./" \
            | sudo tee /etc/apt/sources.list.d/linglong.list
          echo "== 这个源有多快（海外 runner 第一次摸）=="
          time timeout 300 curl -sS -o /dev/null -w "Release HTTP %{http_code}  %{size_download}B  %{time_total}s\n" \
            "https://ci.deepin.com/repo/obs/linglong:/CI:/release/xUbuntu_24.04./Release"
          time sudo apt-get update -qq
          echo "update rc=$?"
          for p in linglong-bin linglong-builder linglong-installer ll-builder; do
            printf '  %-20s -> %s\n' "$p" "$(apt-cache policy $p 2>&1 | sed -n '2,3p' | tr -d '\n')"
          done
          time sudo apt-get install -y -qq linglong-bin linglong-builder
          echo "install rc=$?"
          for b in ll-cli ll-builder ll-oci-adm; do
            printf '  %-12s %s\n' "$b" "$(command -v $b || echo '<缺>')"
          done
          ll-builder --version 2>&1 | head -3
          ll-cli --version 2>&1 | head -3
      - name: 配仓库、拉 base、真构建一个最小 lca
        run: |
          set +e
          echo "== 默认仓库配置 =="
          ll-cli repo list 2>&1 | head -10
          echo "== 能不能搜到 base =="
          timeout 300 ll-cli search org.deepin.base 2>&1 | head -12
          echo "search rc=$?"
          cat > /tmp/linglong.yaml <<'YAML'
          version: "1"
          package:
            id: org.probe.app
            name: probe
            version: 0.0.0.1
            kind: app
            description: |
              probe
          command: [/opt/apps/org.probe.app/files/bin/probe]
          base: org.deepin.base/25.2.1
          sources: []
          build: |
            mkdir -p $PREFIX/bin
            printf '#!/bin/sh\necho linyaps-ran\n' > $PREFIX/bin/probe
            chmod +x $PREFIX/bin/probe
          YAML
          mkdir -p /tmp/llp && cp /tmp/linglong.yaml /tmp/llp/
          cd /tmp/llp
          echo "== ll-builder build（这一步见 base 与容器两条坎）=="
          time timeout 900 ll-builder build
          echo "build rc=$?"
          echo "== export 成 .lca / appinstaller =="
          timeout 600 ll-builder export
          echo "export rc=$?"
          find /tmp/llp -name "*.lca" -o -name "*.deb" | head -5
          echo "== 如果上面全红，把环境类硬约束也打出来 =="
          echo "bwrap 自检：$(bwrap --ro-bind / / --dev /dev --unshare-all echo ok 2>&1 | tail -1)"
          echo "user namespaces: $(cat /proc/sys/user/max_user_namespaces 2>&1)  unpriv clamp: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>&1)"
          echo "fuse: $(ls -la /dev/fuse 2>&1 | tail -1)"
          echo "systemd: $(ps -p 1 -o comm= 2>&1)"
