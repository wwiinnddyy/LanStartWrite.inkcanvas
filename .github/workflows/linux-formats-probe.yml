# 一次性探针：三种 Linux 安装格式在 GitHub runner 上到底能不能造、能不能验。
# 不问代码质量、不出产物，只把三条未知量拿真 runner 跑一遍、把原始输出打回来：
#   1) deb —— dpkg-deb 造包 + docker 起一个 ubuntu:24.04 真装一遍（这是"验"的那条路）
#   2) flatpak —— 装 flatpak-builder、拉 Flathub 运行时、build 一个最小包并 **flatpak run 跑起来**
#   3) 玲珑 —— Deepin 工具链在不在 Ubuntu 自己的源里、PyPI 上有没有、海外 runner 够不够得着 Deepin 的源
# 探完即删，不进 release 那条线。
name: linux-formats-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: deb（造 + 装）
    runs-on: ubuntu-latest
    steps:
      - name: 造一个最小 deb 并在 ubuntu:24.04 里装
        shell: bash
        run: |
          set +e
          echo "== 工具在不在 =="
          for t in dpkg-deb dpkg-shlibdeps dh lintian; do
            printf '  %-16s %s\n' "$t" "$(command -v $t || echo '<缺>')"
          done
          echo "docker: $(docker --version 2>&1)"

          root=$(mktemp -d)/probe_1.0.0_amd64
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/opt/probe" "$root/usr/share/applications"
          printf 'Package: probe\nVersion: 1.0.0\nArchitecture: amd64\nMaintainer: probe <p@example.com>\nDescription: probe\n  probe\n' > "$root/DEBIAN/control"
          printf '#!/bin/sh\necho probe-ran\n' > "$root/usr/bin/probe"
          chmod 755 "$root/usr/bin/probe"
          echo data > "$root/opt/probe/payload.txt"
          printf '[Desktop Entry]\nType=Application\nName=Probe\nExec=probe\nIcon=probe\nTerminal=false\nCategories=Graphics;\n' > "$root/usr/share/applications/org.test.Probe.desktop"
          dpkg-deb --build --root-owner-group "$root" probe.deb
          echo "build rc=$?"; dpkg-deb -I probe.deb | head -20

          echo "== 容器里真装一遍 =="
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq >/dev/null
            apt-get install -y -qq ./probe.deb >/dev/null && echo "apt install: OK"
            dpkg -L probe | sed "s/^/  /"
            /usr/bin/probe
            echo "== desktop 文件校验 =="
            command -v desktop-file-validate >/dev/null || echo "  (镜像里没有 desktop-file-validate，跳过)"
            echo "== ldd 依赖解析（拿真二进制试的那条路）=="
          '
          echo "container rc=$?"

  flatpak:
    name: flatpak（builder + 真跑一次）
    runs-on: ubuntu-latest
    steps:
      - name: 装工具链
        shell: bash
        run: |
          set -e
          time sudo apt-get update -qq
          time sudo apt-get install -y -qq flatpak flatpak-builder bubblewrap
          flatpak --version
          flatpak-builder --version
          bwrap --version
      - name: 建一个最小 flatpak 并跑起来
        shell: bash
        env:
          MANIFEST: /tmp/org.test.Probe.json
        run: |
          set +e
          cat > "$MANIFEST" <<'JSON'
          {
            "app-id": "org.test.Probe",
            "runtime": "org.freedesktop.Platform",
            "runtime-version": "23.08",
            "sdk": "org.freedesktop.Sdk",
            "command": "probe",
            "finish-args": ["--share=network"],
            "modules": [{
              "name": "probe",
              "buildsystem": "simple",
              "build-commands": ["install -Dm755 probe.sh /app/bin/probe"],
              "sources": [{ "type": "script", "dest-filename": "probe.sh", "commands": ["echo flatpak-ran"] }]
            }]
          }
          JSON
          echo "== 拉 flathub 远端 =="
          time flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "remote rc=$?"
          echo "== builder（含运行时下载，这一步见体积与耗时）=="
          time flatpak-builder --user --disable-updates --force-clean --ccache /tmp/bc "$MANIFEST"
          echo "builder rc=$?"
          echo "== 装进用户实例并真跑一次 =="
          flatpak-builder --user --install=/tmp/inst "$MANIFEST"
          echo "install rc=$?"
          flatpak run org.test.Probe
          echo "run rc=$?"
          du -sh /tmp/inst 2>/dev/null

  linglong:
    name: 玲珑（工具链可达性）
    runs-on: ubuntu-latest
    steps:
      - name: 四条路各探一次，只报原始结果
        shell: bash
        run: |
          set +e
          echo "== A. Ubuntu 自己的源里有没有 =="
          sudo apt-get update -qq >/dev/null
          for p in linglong-build-tool llbuild-cli linglong; do
            printf '  apt-cache policy %-22s -> %s\n' "$p" "$(apt-cache policy $p 2>&1 | tr '\n' ' ' | cut -c1-90)"
          done
          apt-cache search linglong 2>&1 | head -5
          apt-cache search llbuild 2>&1 | head -5

          echo "== B. PyPI 上有没有 =="
          python3 -m pip download --no-deps -d /tmp/ll linglong-build-tool 2>&1 | tail -3
          curl -sS -o /dev/null -w "  pypi/linglong-build-tool -> HTTP %{http_code}\n" \
            https://pypi.org/pypi/linglong-build-tool/json
          curl -sS -o /dev/null -w "  pypi/llbuild-cli          -> HTTP %{http_code}\n" \
            https://pypi.org/pypi/llbuild-cli/json
          curl -sS https://pypi.org/pypi/linglong-build-tool/json 2>&1 | head -c 200; echo

          echo "== C. Deepin / OpenAtom 的源够不够得着（海外 runner）=="
          for u in https://community-packages.deepin.com/deepin/dists/beige/Release \
                   https://mirror-china.deepin.com/deepin/dists/beige/Release \
                   https://mirrors.openatom.tech/linglong \
                   https://enterprise-repo.linglong.so \
                   https://docs.linglong.so; do
            printf '  %-58s ' "$u"
            curl -sS -m 12 -o /dev/null -w "HTTP %{http_code}  %l 字节  %t 秒\n" "$u" 2>&1 | tail -1
          done

          echo "== D. 容器路线（llbuild-cli 要在 base image 里跑）=="
          for img in linglong/linglong-builder ubti94/linglong-builder deepin/linglong; do
            printf '  docker pull %-32s -> ' "$img"
            timeout 90 docker pull "$img" 2>&1 | tail -1
          done
          echo "== E. 上游仓库本身 =="
          curl -sS -o /dev/null -w "  github.com/deepin-community/linglong-builder -> HTTP %{http_code}\n" \
            https://github.com/deepin-community/linglong-builder
          curl -sS -o /dev/null -w "  github.com/LinglongRepo/linglong-builder     -> HTTP %{http_code}\n" \
            https://github.com/LinglongRepo/linglong-builder
          curl -sS -o /dev/null -w "  github.com/LinglongRepo/linglong             -> HTTP %{http_code}\n" \
            https://github.com/LinglongRepo/linglong
          echo "探针结束（这个 job 总是绿的，看的是输出）"
